project:
  type: website
  output-dir: docs
  post-render:
    - python3 tools/check_workshop.py
  pre-render:
    - python3 tools/build_workshop.py
  render:
    - "*.qmd"
    - "blog/*/index.qmd"
    - "projects/*/index.qmd"
  resources:
    - "!docs/**"
    - assets/workshop/
    - "assets/free-probability/*.svg"
    - "assets/free-probability/*.png"
website:
  title: Angelo Farfan
  site-url: https://angelo.dev
  description: Mathematics, algorithms, machine learning, and other things I find interesting.
format:
  html:
    minimal: true
    title-block-style: none
    template: layouts/workshop.html
    html-math-method: mathjax
    toc: true
    toc-depth: 2
    section-divs: true
    highlight-style: github
filters:
  - layouts/workshop.lua
site-root: ""
lang: en
