<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Normalization placement determines the symmetry</title><desc id="desc">A common matrix scale cancels when RMS normalization follows it. The scale remains when normalization precedes the matrix.</desc>
<rect width="960" height="440" fill="#fffdf8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#262c29"><text x="36" y="40" font-size="21">Where does the scale meet normalization?</text><text x="36" y="92" font-size="17">Normalize after the matrix</text><text x="42" y="137" font-size="21">x</text><rect x="135" y="105" width="120" height="56" rx="6" fill="#eeede4" stroke="#d8d8cd"/><text x="195" y="140" font-size="23" text-anchor="middle">cW</text><rect x="340" y="105" width="120" height="56" rx="6" fill="#eeede4" stroke="#d8d8cd"/><text x="400" y="140" font-size="23" text-anchor="middle">n(·)</text><line x1="68" y1="133" x2="120" y2="133" stroke="#526f82" stroke-width="2" marker-end="url(#arrow)"/><line x1="267" y1="133" x2="325" y2="133" stroke="#526f82" stroke-width="2" marker-end="url(#arrow)"/><line x1="472" y1="133" x2="535" y2="133" stroke="#526f82" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="140" font-size="23" fill="#ad492d">n(cWx) = n(Wx)</text><text x="36" y="252" font-size="17">Normalize before the matrix</text><text x="42" y="297" font-size="21">x</text><rect x="135" y="265" width="120" height="56" rx="6" fill="#eeede4" stroke="#d8d8cd"/><text x="195" y="300" font-size="23" text-anchor="middle">n(·)</text><rect x="340" y="265" width="120" height="56" rx="6" fill="#eeede4" stroke="#d8d8cd"/><text x="400" y="300" font-size="23" text-anchor="middle">cW</text><line x1="68" y1="293" x2="120" y2="293" stroke="#526f82" stroke-width="2" marker-end="url(#arrow)"/><line x1="267" y1="293" x2="325" y2="293" stroke="#526f82" stroke-width="2" marker-end="url(#arrow)"/><line x1="472" y1="293" x2="535" y2="293" stroke="#526f82" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="300" font-size="23" fill="#ad492d">cWn(x) = c · Wn(x)</text><text x="36" y="405" font-size="14" fill="#656a62">Idealized RMS normalization n, positive c, nonzero normalized inputs, and zero epsilon.</text></g></svg>
