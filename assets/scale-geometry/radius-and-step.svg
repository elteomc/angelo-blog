<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Radius changes an SGD step</title><desc id="desc">Two exact raw SGD updates on a scale-invariant squared loss, drawn with the same coordinate scale.</desc>
<rect width="960" height="440" fill="#fffdf8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#262c29"><text x="36" y="40" font-size="21">Same predictor. Same learning rate. Different rotation.</text><line x1="480" y1="72" x2="480" y2="385" stroke="#d8d8cd"/><text x="36" y="92" font-size="18">Radius 1</text><text x="36" y="118" font-size="14" fill="#656a62">initial weight (1, 0)</text><line x1="65" y1="300" x2="430" y2="300" stroke="#d8d8cd"/><line x1="100" y1="324" x2="100" y2="150" stroke="#d8d8cd"/><line x1="100" y1="300" x2="208" y2="300" stroke="#526f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="208" y1="300" x2="208" y2="246.0" stroke="#ad492d" stroke-width="3" marker-end="url(#arrow)"/><line x1="100" y1="300" x2="208" y2="246.0" stroke="#262c29" stroke-width="2" marker-end="url(#arrow)"/><circle cx="100" cy="300" r="4" fill="#262c29"/><text x="224" y="238.0" font-size="15" fill="#ad492d">step 0.5</text><text x="36" y="354" font-size="24">26.57°</text><text x="36" y="380" font-size="14" fill="#656a62">tan(angle) = 0.5</text><text x="516" y="92" font-size="18">Radius 2</text><text x="516" y="118" font-size="14" fill="#656a62">initial weight (2, 0)</text><line x1="545" y1="300" x2="910" y2="300" stroke="#d8d8cd"/><line x1="580" y1="324" x2="580" y2="150" stroke="#d8d8cd"/><line x1="580" y1="300" x2="796" y2="300" stroke="#526f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="796" y1="300" x2="796" y2="273.0" stroke="#ad492d" stroke-width="3" marker-end="url(#arrow)"/><line x1="580" y1="300" x2="796" y2="273.0" stroke="#262c29" stroke-width="2" marker-end="url(#arrow)"/><circle cx="580" cy="300" r="4" fill="#262c29"/><text x="812" y="265.0" font-size="15" fill="#ad492d">step 0.25</text><text x="516" y="354" font-size="24">7.13°</text><text x="516" y="380" font-size="14" fill="#656a62">tan(angle) = 0.125</text><text x="36" y="420" font-size="13" fill="#656a62">Blue: initial weight     Rust: SGD displacement     Ink: updated weight     Learning rate = 0.5</text></g></svg>
